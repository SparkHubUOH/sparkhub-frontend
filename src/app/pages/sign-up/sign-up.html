<div class="signup-page">
  <div class="signup-container">
    <div class="signup-left">
      <ng-container *ngIf="currentLang === 'en'; else arabicButton">
        <a class="back" [routerLink]="['/home']">
           <i class="bi bi-arrow-left-short" style="color: #657a99; font-size: 30px"></i>
        </a>
      </ng-container>

      <ng-template #arabicButton>
        <a class="back" [routerLink]="['/home']">
          <i class="bi bi-arrow-right-short" style="color: #657a99; font-size: 30px"></i>
        </a>
      </ng-template>
      <h1>{{ 'SIGNUP.TITLE' | translate }}</h1>
      <form class="signup-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="row two">
          <label>
            <span>{{ 'SIGNUP.FIRST_NAME' | translate }}</span>
            <input type="text" formControlName="first_name" placeholder="{{ 'SIGNUP.FIRST_NAME' | translate }}" />
          </label>
          <label>
            <span>{{ 'SIGNUP.LAST_NAME' | translate }}</span>
            <input type="text" formControlName="last_name" placeholder="{{ 'SIGNUP.LAST_NAME' | translate }}" />
          </label>
        </div>

        <div class="row two">
          <label>
            <span>{{ 'SIGNUP.PHONE' | translate }}</span>
            <input type="tel" formControlName="phone" placeholder="{{ 'SIGNUP.PHONE' | translate }}" />
          </label>
          <label>
            <span>{{ 'SIGNUP.UNIVERSITY_ID' | translate }}</span>
            <input type="text" formControlName="university_id" placeholder="{{ 'SIGNUP.UNIVERSITY_ID' | translate }}" />
          </label>
        </div>

        <label class="full">
          <span>{{ 'SIGNUP.EMAIL' | translate }}</span>
          <input type="email" formControlName="email" placeholder="{{ 'SIGNUP.EMAIL' | translate }}" />
        </label>

        <label class="full">
          <span>{{ 'SIGNUP.PASSWORD' | translate }}</span>
          <input type="password" formControlName="password" placeholder="{{ 'SIGNUP.PASSWORD' | translate }}" />
        </label>

        <button class="primary" type="submit">{{ 'SIGNUP.CREATE' | translate }}</button>

        <p class="alt" [innerHTML]="'SIGNUP.ALREADY' | translate"></p>
      </form>
    </div>

    <div class="signup-right" aria-hidden="true">
      <div class="graphic">
        <img
          src="assets/images/sdhnn 1.png"
          alt="Signup Graphic"
          style="width: fit-content; height: 100%; object-fit: contain; border-radius: 100px;"
        />
      </div>
    </div>
  </div>
</div>
