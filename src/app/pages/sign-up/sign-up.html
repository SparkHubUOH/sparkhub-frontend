<div class="signup-page">
  <div class="signup-card">
    <a class="back" [routerLink]="['/home']">
      <ng-container *ngIf="currentLang === 'en'; else arabicIcon">
        <i class="bi bi-arrow-left-short"></i>
      </ng-container>

      <ng-template #arabicIcon>
        <i class="bi bi-arrow-right-short"></i>
      </ng-template>
    </a>

    <div class="header">
      <h1>{{ 'SIGNUP.TITLE' | translate }}</h1>
      <p>{{ 'SIGNUP.SUBTITLE' | translate }}</p>
    </div>

    <form class="signup-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid two">
        <label class="field">
          <span>{{ 'SIGNUP.FIRST_NAME' | translate }}</span>
          <input type="text" formControlName="first_name" />
          <div *ngIf="form.get('first_name')?.touched && form.get('first_name')?.invalid">
            <small class="error-message">{{ 'SIGNUP.FIRST_NAME_ERROR' | translate }}</small>
          </div>
        </label>

        <label class="field">
          <span>{{ 'SIGNUP.LAST_NAME' | translate }}</span>
          <input type="text" formControlName="last_name" />
          <div *ngIf="form.get('last_name')?.touched && form.get('last_name')?.invalid">
            <small class="error-message">{{ 'SIGNUP.LAST_NAME_ERROR' | translate }}</small>
          </div>
        </label>
      </div>

      <div class="grid two">
        <label class="field">
          <span>{{ 'SIGNUP.PHONE' | translate }}</span>
          <input type="tel" formControlName="phone" />
          <div *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">
            <small class="error-message">{{ 'SIGNUP.PHONE_ERROR' | translate }}</small>
          </div>
        </label>

        <label class="field">
          <span>{{ 'SIGNUP.UNIVERSITY_ID' | translate }}</span>
          <input type="text" formControlName="university_id" />

          <small class="hint">{{ 'SIGNUP.UNIVERSITY_ID_HINT' | translate }}</small>
        </label>
      </div>

      <label class="field full">
        <span>{{ 'SIGNUP.EMAIL' | translate }}</span>
        <input type="email" formControlName="email" />
        <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          <small class="error-message">{{ 'SIGNUP.EMAIL_ERROR' | translate }}</small>
        </div>
      </label>

      <label class="field full">
        <span>{{ 'SIGNUP.PASSWORD' | translate }}</span>
        <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" />
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
            <i class="bi bi-eye" *ngIf="!showPassword"></i>
            <i class="bi bi-eye-slash" *ngIf="showPassword"></i>
          </button>
        </div>
        <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          <small class="error-message">{{ 'SIGNUP.PASSWORD_ERROR' | translate }}</small>
        </div>
      </label>

      <button class="primary" type="submit" [disabled]="form.invalid">
        {{ 'SIGNUP.CREATE' | translate }}
      </button>

      <p class="alt" [innerHTML]="'SIGNUP.ALREADY' | translate"></p>
    </form>
  </div>
</div>
