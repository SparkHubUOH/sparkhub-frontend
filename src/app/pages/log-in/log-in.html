<div class="auth-page">

  <div class="auth-card">

    <a class="back" [routerLink]="['/home']">
      <ng-container *ngIf="currentLang === 'en'; else arabicIcon">
        <i class="bi bi-arrow-left-short"></i>
      </ng-container>

      <ng-template #arabicIcon>
        <i class="bi bi-arrow-right-short"></i>
      </ng-template>
    </a>

    <div class="header">
      <h1>{{ 'Welcome back' | translate }}</h1>
      <p>Enter your information to log in</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="login()" novalidate>

      <label class="field full">
        <span>{{ 'SIGNUP.EMAIL' | translate }}</span>
        <input type="email" formControlName="email" />
        <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          <small class="error-message">Enter a valid email</small>
        </div>
      </label>

      <label class="field full">
        <span>{{ 'SIGNUP.PASSWORD' | translate }}</span>
        <input type="password" formControlName="password" />
        <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          <small class="error-message">Password is required</small>
        </div>
      </label>

      <div class="actions">
        <span class="forgot" [innerHTML]="'LOGIN.FORGOT' | translate"></span>
      </div>

      <button class="primary" type="submit" [disabled]="form.invalid">
        {{ 'LOGIN.CREATE' | translate }}
      </button>

      <div *ngIf="form.errors?.['invalid']">
        <small class="error-message">Incorrect email or password</small>
      </div>

      <p class="alt" [innerHTML]="'LOGIN.NEW' | translate"></p>

    </form>

  </div>

</div>
