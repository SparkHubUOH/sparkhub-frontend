<div class="profile-layout">
  <div class="members-page">
    <header class="members-header">
      <button class="back-btn" type="button" [routerLink]="['/dashboard']">
        <i class="bi bi-chevron-left"></i>
      </button>
    </header>

    <div class="members-topbar">
      <h1 class="page-title" *ngIf="clubName">{{ clubName }} Members</h1>
      <h1 class="page-title" *ngIf="!clubName">Loading...</h1>

      <button class="join-btn" type="button" [routerLink]="['/dashboard/join-requests', clubId]">
        View Join Requests
      </button>
    </div>

    <div class="members-list-box">
      <div class="member-row" *ngFor="let member of allMembers; trackBy: trackByFn">
        <div class="member-name">
          {{ member.name }}
        </div>

        <div class="role-label">
          {{ member.role }}
        </div>

        <div class="actions">
          <button class="icon-btn filled" type="button" (click)="openAssignModal(member)">
            <i class="bi bi-ui-radios"></i>
          </button>

          <button
            class="icon-btn"
            [routerLink]="['/dashboard/user-profile', member.userId]"
            type="button"
          >
            <i class="bi bi-person"></i>
          </button>

          <button
            class="icon-btn"
            type="button"
            (click)="selectedMemberName = member.name; showDeleteModal = true"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" *ngIf="showAssignModal">
      <div class="modal-card">
        <button class="close-btn" type="button" (click)="closeAssignModal()">×</button>
        <h3>Assign Member Role & Team</h3>

        <div class="assign-container">
          <p>
            Member Role:
            <strong>{{ selectedFromRole }}</strong>
          </p>

          <div class="field-group">
            <label>Select Role</label>

            <select [(ngModel)]="selectedToRole" class="role-select">
              <option value="vice leader">Vice Leader</option>
              <option value="team leader">Team Leader</option>
              <option value="member">Member</option>
            </select>
          </div>

          <div class="field-group">
            <label>Select Team</label>

            <select [(ngModel)]="selectedTeam" class="role-select">
              <option [value]="null">None (General Club Role)</option>

              <option *ngFor="let team of teamsList" [value]="team.value">
                {{ team.label }}
              </option>
            </select>

          </div>
        </div>

        <div class="modal-footer">
          <button class="save-btn" type="button" (click)="saveAssignedRole()">Save Changes</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" *ngIf="showDeleteModal">
      <div class="delete-card">
        <button class="close-btn" type="button" (click)="showDeleteModal = false">×</button>

        <h3>Remove Member</h3>

        <p>Are you sure you want to remove the member?</p>

        <div class="delete-actions">
          <button class="no-btn" type="button" (click)="showDeleteModal = false">No</button>

          <button class="yes-btn" type="button" (click)="removeMember()">Yes, Remove</button>
        </div>
      </div>
    </div>
  </div>
  <app-profile-sidebar></app-profile-sidebar>
</div>
