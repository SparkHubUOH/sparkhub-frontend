<aside class="sidebar">
  <div class="brand-block">
    <div class="brand-logo">SH</div>
    <div>
      <h1>{{ 'DASHBOARD.SIDEBAR.TITLE' | translate }}</h1>
      <p>{{ 'DASHBOARD.SIDEBAR.SUBTITLE' | translate }}</p>
    </div>
  </div>

  <nav class="nav-list">
    <a class="nav-link" [innerHTML]="'DASHBOARD.SIDEBAR.HOME' | translate"></a>
    <a class="nav-link" [innerHTML]="'DASHBOARD.SIDEBAR.CLUBS' | translate"></a>
    <a class="nav-link" [innerHTML]="'DASHBOARD.SIDEBAR.ACTIVITIES' | translate"></a>
    <a class="nav-link" href="https://discord.gg/puXVauCU" target="_blank" [innerHTML]="'DASHBOARD.SIDEBAR.CHAT' | translate"></a>
    <div class="right-controls" [class.hidden-mobile]="isMobile">
      <div class="lang-dropdown">
        <button class="nav-link" type="button" (click)="toggleLanguage()">
          <span class="nav-label" *ngIf="!collapsed">{{
            'PROFILE_SIDEBAR.LANGUAGE' | translate
          }}</span>
        </button>
      </div>
    </div>
    <button
      class="nav-link"
      (click)="onLogout()"
      [innerHTML]="'DASHBOARD.SIDEBAR.LOGOUT' | translate"
    ></button>
  </nav>
</aside>
