<div class="sidebar-shell" [class.collapsed]="collapsed">
  <!-- <button class="menu-toggle" type="button" (click)="toggle()" aria-label="Toggle sidebar">
    <span class="menu-icon"></span>
    <span class="menu-text">Menu</span>
  </button> -->

  <aside class="sidebar" [class.collapsed]="collapsed">
    <div class="sidebar-header">
      <button class="collapse-btn" type="button" (click)="toggle()" aria-label="Toggle collapse">
        <span>{{ collapsed ? '‹' : '›' }}</span>
      </button>
      <div class="brand">
        <span class="brand-name" *ngIf="!collapsed">SparkHub</span>
      </div>
    </div>

    <nav class="nav-list">
      <button class="nav-item" type="button" (click)="goToProfile()">
        <span class="nav-icon"><i class="bi bi-person"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{ 'PROFILE_SIDEBAR.PROFILE' | translate }}</span>
      </button>

      <button class="nav-item" type="button" (click)="goToClub()" *ngIf="authService.getUserRole() === 'leader'">
        <span class="nav-icon"><i class="bi bi-bank"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{ 'PROFILE_SIDEBAR.CLUB_MANAGEMENT' | translate }}</span>
      </button>

      <button class="nav-item" type="button" (click)="goToClubs()" *ngIf="authService.getUserRole() === 'staff'">
        <span class="nav-icon"><i class="bi bi-bank"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{ 'PROFILE_SIDEBAR.CLUBS' | translate }}</span>
      </button>

      <button class="nav-item" type="button" (click)="goToAnalytics()" *ngIf="authService.getUserRole() === 'staff'">
        <span class="nav-icon"><i class="bi bi-bar-chart-line"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{ 'PROFILE_SIDEBAR.ANALYTICS' | translate }}</span>
      </button>

      <button class="nav-item" type="button" (click)="goToOrganizationalStructure()" *ngIf="authService.getUserRole() === 'leader'">
        <span class="nav-icon"><i class="bi bi-easel2"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{ 'PROFILE_SIDEBAR.ORGANIZATIONAL_STRUCTURE' | translate }}</span>
      </button>

      <button class="nav-item" type="button" (click)="toggleLanguage()">
        <span class="nav-icon"><i class="bi bi-globe"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{ 'PROFILE_SIDEBAR.LANGUAGE' | translate }}</span>
      </button>
      <!-- <div class="right-controls" [class.hidden-mobile]="isMobile">
        <div class="lang-dropdown">
          <button class="nav-link language-toggle" (click)="toggleLangMenu()">
            <span *ngIf="languageSelected == 'ar'; else englishFlag" class="body4 p-2">اللغة</span>
            <ng-template #englishFlag>
              <span>Language</span>
            </ng-template>
          </button>
        </div>
      </div> -->
    </nav>
  </aside>
</div>
