<button class="menu-toggle" *ngIf="isMobile" (click)="menuOpen = !menuOpen">
  <span class="menu-icon"></span>
  <span class="menu-text">Menu</span>
</button>

<div class="sidebar-shell" [class.collapsed]="collapsed">
  <aside class="sidebar" [class.collapsed]="collapsed" [class.open]="menuOpen">
    <div class="sidebar-header">
      <button class="collapse-btn" type="button" (click)="toggle()" aria-label="Toggle collapse">
        <span>{{ collapsed ? '‹' : '›' }}</span>
      </button>
      <div class="brand">
        <span class="brand-name" *ngIf="!collapsed">SparkHub</span>
      </div>
    </div>

    <nav class="nav-list">
      <button class="nav-item" type="button" (click)="goToProfile()">
        <span class="nav-icon"><i class="bi bi-person"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{
          'PROFILE_SIDEBAR.PROFILE' | translate
        }}</span>
      </button>

      <button
        class="nav-item"
        type="button"
        (click)="goToAttendedActivities()"
        *ngIf="authService.getUserRole() === 'leader' || authService.getUserRole() === 'student'"
      >
        <span class="nav-icon"><i class="bi bi-award"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{
          'PROFILE_SIDEBAR.ACTIVITIES_REGISTERED' | translate
        }}</span>
      </button>

      <button
        class="nav-item"
        type="button"
        (click)="goToClub()"
        *ngIf="authService.getUserRole() === 'leader'"
      >
        <span class="nav-icon"><i class="bi bi-bank"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{
          'PROFILE_SIDEBAR.CLUB_MANAGEMENT' | translate
        }}</span>
      </button>

      <button
        class="nav-item"
        type="button"
        (click)="goToClubs()"
        *ngIf="authService.getUserRole() === 'staff'"
      >
        <span class="nav-icon"><i class="bi bi-bank"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{ 'PROFILE_SIDEBAR.CLUBS' | translate }}</span>
      </button>

      <button
        class="nav-item"
        type="button"
        (click)="goToAnalytics()"
        *ngIf="authService.getUserRole() === 'staff'"
      >
        <span class="nav-icon"><i class="bi bi-bar-chart-line"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{
          'PROFILE_SIDEBAR.ANALYTICS' | translate
        }}</span>
      </button>

      <button
        class="nav-item"
        type="button"
        (click)="goToOrganizationalStructure()"
        *ngIf="authService.getUserRole() === 'leader'"
      >
        <span class="nav-icon" style="width: 47px"><i class="bi bi-easel2"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{
          'PROFILE_SIDEBAR.ORGANIZATIONAL_STRUCTURE' | translate
        }}</span>
      </button>

      <button class="nav-item" type="button" (click)="toggleLanguage()">
        <span class="nav-icon"><i class="bi bi-globe"></i></span>
        <span class="nav-label" *ngIf="!collapsed">{{
          'PROFILE_SIDEBAR.LANGUAGE' | translate
        }}</span>
      </button>
    </nav>
  </aside>
</div>
